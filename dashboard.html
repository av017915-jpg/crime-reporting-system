<!DOCTYPE html>
<html>

<head>

<title>Police Dashboard</title>

<style>

body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
}

.box{
width:500px;
margin:auto;
margin-top:50px;
background:#222;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 10px red;
}

h1{
color:red;
}

.card{
background:#333;
padding:20px;
margin:15px;
border-radius:8px;
}

button{
padding:10px 20px;
background:red;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h1>Police Dashboard</h1>

<div class="card">
<h2>Total Reports</h2>
<p>128</p>
</div>

<div class="card">
<h2>High Risk Crimes</h2>
<p>32</p>
</div>

<div class="card">
<h2>Cyber Crimes</h2>
<p>20</p>
</div>

<button onclick="openReports()">
View Crime Reports
</button>

</div>

<script>

function openReports(){

window.location.href =
"report.html";

}

</script>

</body>
</html>
